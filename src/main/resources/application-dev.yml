spring:
  # Multi-Database Configuration
  datasource:
    # Auth Database (Primary)
    auth:
      jdbc-url: jdbc:mysql://localhost:3306/beyos_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: BeyosAuthHikariPool
        maximum-pool-size: 5  # Reduced from 10
        minimum-idle: 2  # Reduced from 5
        connection-timeout: 20000
        idle-timeout: 300000
        max-lifetime: 1200000

